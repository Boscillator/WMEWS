name: WMEWS CLI CI

on:
  push:
    branches: [main]
    paths:
      - "wmews-cli/**"
  pull_request:
    paths:
      - "wmews-cli/**"

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wmews-cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: wmews-cli/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .
      - run: uv run pytest

  container:
    name: Build${{ github.event_name == 'push' && ' and push' || '' }} container
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.WMEWS_CLI_ECR_PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        id: login-ecr
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: wmews-cli
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/wmews-cli:sha-{1},{0}/wmews-cli:latest', steps.login-ecr.outputs.registry, github.sha) || 'wmews-cli:ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
